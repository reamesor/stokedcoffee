  <main class="page grain-paper">
    <div class="page-inner">
      <p class="label">Host us</p>
      <h1>Want Stoked at your space or event? We’re in.</h1>
      <p>Cafes. Events. Brands. Write it down. We’ll read it.</p>
      <form class="form-stack host-form" id="host-form" data-on="true">
        <label class="label" for="host-name">Name</label>
        <input class="ink-field" id="host-name" name="name" type="text" autocomplete="name" required>
        <label class="label" for="host-email">Email</label>
        <input class="ink-field" id="host-email" name="email" type="email" autocomplete="email" required>
        <label class="label" for="host-type">Event type</label>
        <select class="ink-field" id="host-type" name="type" required>
          <option value="" disabled selected>Pick one</option>
          <option>Cafe</option>
          <option>Event</option>
          <option>Brand</option>
          <option>Other</option>
        </select>
        <label class="label" for="host-date">Proposed date</label>
        <input class="ink-field" id="host-date" name="date" type="text" placeholder="whenever it is">
        <label class="label" for="host-turnout">Expected turnout</label>
        <input class="ink-field" id="host-turnout" name="turnout" type="text" inputmode="numeric" placeholder="a number, roughly">
        <button class="ink-btn" type="submit">Send it</button>
      </form>
      <div class="confirm" id="host-confirm" data-on="false" role="status">
        <p>Got it. We’ll write back.</p>
      </div>
    </div>
  </main>
  <script>
    (function () {
      var form = document.getElementById("host-form");
      var confirm = document.getElementById("host-confirm");
      var KEY = "stoked-host";
      function showDone() {
        form.setAttribute("data-on", "false");
        confirm.setAttribute("data-on", "true");
      }
      try { if (window.localStorage.getItem(KEY)) showDone(); } catch (e) {}
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!form.checkValidity()) { form.reportValidity(); return; }
        var payload = {
          name: document.getElementById("host-name").value.trim(),
          email: document.getElementById("host-email").value.trim(),
          type: document.getElementById("host-type").value,
          date: document.getElementById("host-date").value.trim(),
          turnout: document.getElementById("host-turnout").value.trim()
        };
        try { window.localStorage.setItem(KEY, JSON.stringify(payload)); } catch (err) {}
        showDone();
      });
    })();
  </script>
